name: cms
description: "Church Management System — Admin web & desktop app for New Church."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.14.0
  cloud_firestore: ^5.6.11
  firebase_auth: ^5.5.4
  firebase_storage: ^12.4.6

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Local DB (desktop offline-first) — added in Phase 5
  # isar: ^3.1.0+1
  # isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # UI / data grids / charts
  data_table_2: ^2.5.14
  fl_chart: ^0.70.2

  # PDF export
  pdf: ^3.11.3
  printing: ^5.14.3

  # File import
  file_picker: ^9.0.2
  csv: ^6.0.0

  # Network / connectivity
  connectivity_plus: ^6.1.4
  http: ^1.4.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  # isar_generator: ^3.1.0+1   # added in Phase 5 alongside isar

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
